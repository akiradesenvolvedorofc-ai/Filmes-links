<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Upload de Arquivo → Link Permanente (Catbox)</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 600px; margin: 2rem auto; padding: 0 1rem; }
    .box { border: 2px dashed #ccc; padding: 2rem; text-align: center; border-radius: 8px; }
    input[type="file"] { margin: 1rem 0; }
    button { padding: 0.8rem 1.5rem; font-size: 1rem; cursor: pointer; background: #0070f3; color: #fff; border: none; border-radius: 4px; }
    button:disabled { background: #999; cursor: not-allowed; }
    #result { margin-top: 1.5rem; padding: 1rem; background: #f0f9ff; border-radius: 6px; word-break: break-all; }
    .erro { background: #fee2e2; color: #b91c1c; }
  </style>
</head>
<body>

  <h1>📤 Upload para Link Permanente</h1>
  <p>Selecione um arquivo de até <strong>25 MB</strong> (ou mais, o limite do Catbox é 200 MB).</p>

  <div class="box">
    <input type="file" id="fileInput">
    <br>
    <button id="uploadBtn">Enviar e gerar link</button>
  </div>

  <div id="result"></div>

  <script>
    const fileInput = document.getElementById('fileInput');
    const uploadBtn = document.getElementById('uploadBtn');
    const resultDiv = document.getElementById('result');

    uploadBtn.addEventListener('click', async () => {
      const file = fileInput.files[0];
      if (!file) {
        alert('Por favor, selecione um arquivo.');
        return;
      }

      uploadBtn.disabled = true;
      uploadBtn.textContent = 'Enviando...';
      resultDiv.innerHTML = '<p>⏳ Fazendo upload... Aguarde.</p>';
      resultDiv.classList.remove('erro');

      const formData = new FormData();
      formData.append('reqtype', 'fileupload');
      // Para upload anônimo, não é necessário enviar userhash.
      // Se tiver uma conta no Catbox, você pode adicionar seu userhash para gerenciar os arquivos depois:
      // formData.append('userhash', 'SEU_USERHASH_AQUI');
      formData.append('fileToUpload', file);

      try {
        const response = await fetch('https://catbox.moe/user/api.php', {
          method: 'POST',
          body: formData
        });

        if (!response.ok) {
          const erro = await response.text();
          throw new Error(`Erro ${response.status}: ${erro}`);
        }

        const linkPermanente = await response.text();

        resultDiv.innerHTML = `
          <p>✅ <strong>Upload concluído!</strong></p>
          <p>Link permanente:</p>
          <p><a href="${linkPermanente}" target="_blank" rel="noopener">${linkPermanente}</a></p>
          <p><button onclick="navigator.clipboard.writeText('${linkPermanente}')">📋 Copiar link</button></p>
        `;
      } catch (error) {
        console.error(error);
        resultDiv.innerHTML = `<p>❌ Falha no upload: ${error.message}</p>`;
        resultDiv.classList.add('erro');
      } finally {
        uploadBtn.disabled = false;
        uploadBtn.textContent = 'Enviar e gerar link';
      }
    });
  </script>

</body>
</html>
